<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Visor Conurbano - Índice de Riesgo</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <style>
    html, body { height: 100%; margin: 0; padding: 0; }
    #map { width: 100%; height: 100%; }

    .legend { 
      background: white; 
      padding: 6px 8px; 
      font: 14px Arial; 
      box-shadow: 0 0 15px rgba(0,0,0,0.2); 
	   bottom: 40px;
    }

    /* 🔍 Estilos del buscador */
    #searchBox {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: white;
      border-radius: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      padding: 5px 10px;
      display: flex;
      align-items: center;
    }

    #searchInput {
      border: none;
      outline: none;
      font-size: 14px;
      padding: 5px;
      width: 250px;
    }

    #searchButton {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 18px;
      margin-left: 5px;
    }
	h3 {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1002;
      background: rgba(255,255,255,0.8);
      padding: 4px 8px;
      border-radius: 4px;
      font-family: Arial;
      margin: 0;
	   font-size: 14px;
    }
	.leaflet-control-container .leaflet-top {
    top: 50px !important;
}
  </style>
</head>
<body>
  <h3>Mapa del Conurbano: Índice de Riesgo, Basurales y Cursos de Agua</h3>

  <!-- 🔍 Barra de búsqueda -->
  <div id="searchBox">
    <input type="text" id="searchInput" placeholder="Buscar dirección..." />
    <button id="searchButton">🔍</button>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script>
    // Inicialización del mapa
    var map = L.map('map').setView([-34.65, -58.55], 10);

    // Capas base
    var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    var carto = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 20,
      attribution: '© OpenStreetMap, © Carto'
    });

    var baseMaps = { "OpenStreetMap": osm, "Carto Light": carto };

    // URLs de capas GeoJSON
    var urlBasurales = "https://raw.githubusercontent.com/santy997/conurbano_basurales_y_rellenos/refs/heads/main/conurbano_basurales_y_rellenos.geojson";
    var urlCursos = "https://raw.githubusercontent.com/santy997/conurbano_curso_de_agua/refs/heads/main/conurbano_curso_de_agua.geojson";
    var urlRiesgo = "https://raw.githubusercontent.com/santy997/capa_que_sirve/refs/heads/main/capa_que_sirve.geojson";

    // Función de colores
    function getColor(valor) {
      valor = parseFloat(valor);
      if (isNaN(valor)) return '#CCCCCC';
      if (valor < 0.22) return '#4CAF50';
      else if (valor < 0.45) return '#FFEB3B';
      else return '#F44336';
    }

    // Estilo de polígonos
    function styleRiesgo(feature) {
      return {
        fillColor: getColor(feature.properties["capap para unir  — Hoja 1_indac"]),
        weight: 1,
        opacity: 1,
        color: 'white',
        dashArray: '3',
        fillOpacity: 0.7
      };
    }

    // Popups
    function onEachFeatureRiesgo(feature, layer) {
      if (feature.properties && feature.properties["capap para unir  — Hoja 1_indac"] !== undefined) {
        layer.bindPopup("<b>Índice de riesgo:</b> " + feature.properties["capap para unir  — Hoja 1_indac"]);
      }
    }

    // Cargar capas
    var riesgoLayer, cursosLayer, basuralesLayer;

    fetch(urlRiesgo)
      .then(resp => resp.json())
      .then(dataRiesgo => {
        riesgoLayer = L.geoJSON(dataRiesgo, { style: styleRiesgo, onEachFeature: onEachFeatureRiesgo }).addTo(map);

        fetch(urlCursos)
          .then(resp => resp.json())
          .then(dataCursos => {
            cursosLayer = L.geoJSON(dataCursos, { style: { color: '#2196F3', weight: 2, opacity: 0.8 } }).addTo(map);

            fetch(urlBasurales)
              .then(resp => resp.json())
              .then(dataBasurales => {
                basuralesLayer = L.geoJSON(dataBasurales, {
                  pointToLayer: function(feature, latlng) {
                    return L.circleMarker(latlng, {
                      radius: 5,
                      fillColor: "#000000",
                      color: "#000000",
                      weight: 1,
                      opacity: 1,
                      fillOpacity: 0.9
                    });
                  }
                }).addTo(map);

                // Control de capas
                var overlayMaps = {
                  "Índice de riesgo": riesgoLayer,
                  "Cursos de agua": cursosLayer,
                  "Basurales y rellenos": basuralesLayer
                };
                L.control.layers(baseMaps, overlayMaps, { collapsed:false }).addTo(map);

                map.fitBounds(riesgoLayer.getBounds());
              });
          });
      })
      .catch(err => console.error("Error cargando capas:", err));

    // Leyenda
    var legend = L.control({position: "bottomright"});
    legend.onAdd = function () {
      var div = L.DomUtil.create("div", "legend");
      div.innerHTML =
        "<b>Índice de riesgo</b><p>" +
        "<i style='background:#4CAF50; width:18px; height:18px; float:left; margin-right:6px; opacity:0.7;'></i> Bajo (0.00–0.22)<p>" +
        "<i style='background:#FFEB3B; width:18px; height:18px; float:left; margin-right:6px; opacity:0.7;'></i> Medio (0.22–0.45)<p>" +
        "<i style='background:#F44336; width:18px; height:18px; float:left; margin-right:6px; opacity:0.7;'></i> Alto (≥0.45)";
      return div;
    };
    legend.addTo(map);

    // 🔍 Buscador de direcciones
    let marcador = null;
	   async function buscarDireccion() {
		const entrada = document.getElementById("searchInput").value.trim();
		if (!entrada) return alert("Escribí una dirección para buscar.");

		// Parámetros que enviaremos al normalizador USIG
		const params = new URLSearchParams({
			direccion: entrada,
			geocodificar: "TRUE",        // pedir coordenadas
			tipoResultado: "calle_altura",
			maxOptions: "3",
			srid: "4326"                 // devolver en WGS84 (lat/lon)
		});

		const url = `https://servicios.usig.buenosaires.gob.ar/normalizar/?${params.toString()}`;

		try 
		{
			const resp = await fetch(url, { method: "GET" });
			if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

			const data = await resp.json();

			// Función auxiliar para buscar coordenadas en la respuesta (x,y o coordenadas)
			function encontrarCoordenadas(obj) {
				if (!obj || typeof obj !== "object") return null;

				// caso directo: objeto con coordenadas
				if (obj.coordenadas && (obj.coordenadas.x !== undefined || obj.coordenadas.y !== undefined)) {
					return { lon: parseFloat(obj.coordenadas.x), lat: parseFloat(obj.coordenadas.y) };
				}

				// caso directo: propiedades x / y sueltas
				if (obj.x !== undefined && obj.y !== undefined) {
					return { lon: parseFloat(obj.x), lat: parseFloat(obj.y) };
				}

				// buscar en arrays u objetos anidados
				for (const k of Object.keys(obj)) {
					const v = obj[k];
					if (Array.isArray(v)) {
						for (const item of v) {
							const c = encontrarCoordenadas(item);
							if (c) return c;
						}
					} 
					else if (typeof v === "object" && v !== null) {
						const c = encontrarCoordenadas(v);
						if (c) return c;
					}
				}
				return null;
			}

			// 1) Primera estrategia: buscar coordenadas en la raíz o en campos esperables
			let coords = encontrarCoordenadas(data);

			// 2) Si no encontró, intentar interpretar objetos comunes de "normalizador"
			if (!coords) {
				// si devuelve una lista de opciones (ej: 'resultados' o 'direcciones'), probar con la primera
				const posiblesArrays = ["resultados", "direcciones", "options", "candidates", "direccionesCoincidentes"];
				for (const name of posiblesArrays) {
					if (Array.isArray(data[name]) && data[name].length > 0) {
						coords = encontrarCoordenadas(data[name][0]);
						if (coords) break;
					}
				}
			}

			if (!coords) {
				console.warn("Respuesta USIG (sin coordenadas detectables):", data);
				return alert("USIG no devolvió coordenadas para esa dirección.");
			}

			const lat = coords.lat, lon = coords.lon;

			// Mostrar en el mapa
			map.setView([lat, lon], 17);
			if (marcador) marcador.remove();
			// tratar de obtener un nombre legible de la respuesta (si existe)
			let display = entrada;
			if (data.direccion_norm && data.direccion_norm.direccion) display = data.direccion_norm.direccion;
			else if (data.direccion && typeof data.direccion === "string") display = data.direccion;
			else {
				// buscar algún texto descriptivo en la respuesta
				const posiblesTextos = ["display_name", "nombre", "direccion", "calle", "descripcion"];
				for (const k of posiblesTextos) {
					if (data[k] && typeof data[k] === "string") { display = data[k]; break; }
				}
			}

			marcador = L.marker([lat, lon]).addTo(map).bindPopup(`<b>${display}</b><br>`).openPopup();

		} 
		catch (err) {
			console.error("Error consultando USIG (normalizar):", err);
			if (err.message && err.message.includes("CORS")) {
				alert("Error de CORS al consultar USIG desde el navegador. Probá mediante un proxy/backend o habilitando CORS en el servidor.");
			} 
			else {
				alert("Error al consultar USIG. Mirá la consola para más detalles.");
			}
		}
	
	}

    document.getElementById('searchButton').addEventListener('click', buscarDireccion);
    document.getElementById('searchInput').addEventListener('keypress', e => { if (e.key === 'Enter') buscarDireccion(); });
	
    
    // 🔧 Solución clave para WebViewer
    window.addEventListener('resize', function() {
      map.invalidateSize();
    });

    // 🔧 Redibuja el mapa después de cargar la pantalla
    setTimeout(() => map.invalidateSize(), 1000);
  </script>
</body>
</html>
